name: Repository Verification

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --prefix backend
      - run: git fetch origin main:main || true
      - run: ./scripts/verify_repo.sh
